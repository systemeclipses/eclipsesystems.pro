slug: shift-swap
term: Shift Swap
definition: A shift swap is a schedule change where one employee trades or transfers an assigned shift to another employee, often with manager approval.
appliesTo: Restaurants, healthcare teams, retail, hospitality, and other shift-based teams use shift swaps to maintain coverage.
misconceptions:
  - A text-message agreement is not always enough; teams still need approval and payroll records.
related: [time-theft, predictive-scheduling]
